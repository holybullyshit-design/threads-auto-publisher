# GitHub Actions의 "schedule" 트리거는 무료 요금제에서 부하에 따라 1~4시간까지도 지연되는
# 걸로 확인됐다(2026-08-24). 그래서 Cloudflare Workers의 Cron Trigger(최소 1분 단위, 노트북
# 켜짐 여부와 무관하게 항상 동작)로 15분마다 GitHub한테 "지금 발행해"라고 직접 찔러준다.
# 배포: npx wrangler deploy (이 폴더 안에서)
# 토큰 등록(최초 1회): npx wrangler secret put GITHUB_TOKEN
#
# 06:00/18:00 KST 상태 요약 푸시 알림(ntfy.sh, 2026-08-26 추가)에 필요한 secret 2개:
#   npx wrangler secret put NTFY_TOPIC   (추측 불가능한 랜덤 문자열 — ntfy.sh는 무료
#     공개 서버라 토픽 이름을 아는 사람은 누구나 구독/발행할 수 있음. 사실상 비밀번호)
#   npx wrangler secret put NTFY_TOKEN   (ntfy.sh 계정의 Access Token, 만료 "Never"로 발급)
#
# NTFY_TOKEN이 왜 필요한가: 처음엔 익명(토큰 없이)으로 발행해봤는데, Cloudflare Workers는
# 전세계 다른 사용자들과 발신 IP를 공유해서 ntfy.sh 무료 서버의 "하루 250건" 할당량이
# 우리 트래픽과 무관하게 이미 소진돼있는 경우가 많다(HTTP 429, 2026-08-26 확인). ntfy.sh
# 계정으로 로그인해서 발급한 Access Token으로 인증하면 할당량이 IP가 아니라 계정 기준으로
# 적용돼서 이 문제가 해결된다(실측 확인 완료).

name = "threads-publish-pinger"
main = "index.js"
compatibility_date = "2026-08-24"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# 알림에서 "눌러서 확인" 눌렀을 때 열릴 대시보드 주소. 비밀값 아님(URL 자체는 공개돼도 무방 —
# /dashboard, /status는 읽기 전용이고 GITHUB_TOKEN 같은 진짜 민감정보는 노출 안 됨).
WORKER_URL = "https://threads-publish-pinger.threadsautopub.workers.dev"
