<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>팔자명가 YouTube 연결</title>
  <link rel="stylesheet" href="/youtube.css">
</head>
<body>
  <main>
    <a class="back" href="/">← 콘텐츠 자동화 관리자</a>
    <section class="panel">
      <p class="eyebrow">PALJA YOUTUBE AUTOMATION</p>
      <h1>팔자명가 YouTube 연결</h1>
      <p class="lead">Instagram 릴스와 같은 영상을 팔자명가 YouTube Shorts에도 예약하기 위한 계정 확인 단계입니다.</p>
      <div id="status" class="status">연결 상태 확인 중…</div>
      <ol>
        <li><button id="connect" type="button">팔자명가 Google 계정 연결</button></li>
        <li id="callback-step" hidden>
          Google 승인 후 <b>pinged</b>가 보이는 페이지의 전체 주소를 복사해 붙여넣으세요.
          <div class="row"><input id="callback-url" type="url" placeholder="https://threads-publish-pinger.../oauth/youtube/callback?code=...&state=..."><button id="complete" type="button">승인 주소 처리</button></div>
        </li>
      </ol>
      <p id="message" class="message"></p>
    </section>
  </main>
  <script src="/youtube.js"></script>
</body>
</html>
