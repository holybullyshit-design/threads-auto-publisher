name: Prepare Instagram daily fortune range

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        required: true
      end:
        description: End date (YYYY-MM-DD)
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm ci
      - name: Render validated cards
        run: node cloud/prepare-instagram-range.js "${{ inputs.start }}" "${{ inputs.end }}"
      - name: Publish immutable card images
        run: |
          git config user.name "threads-auto-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/generated/instagram
          git commit -m "chore: render Instagram fortunes ${{ inputs.start }} to ${{ inputs.end }}"
          git push
          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Register Instagram schedule
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: node cloud/register-instagram-range.js "$IMAGE_SHA"
