name: Publish scheduled Threads posts

on:
  schedule:
    # 10분마다 실행 (GitHub의 스케줄은 정확히 그 분에 도는 것을 보장하지 않고
    # 몇 분 정도 늦게 도는 경우가 있습니다 - 개인 자동화 용도로는 충분합니다)
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish due posts
        env:
          THREADS_ACCOUNTS_JSON: ${{ secrets.THREADS_ACCOUNTS_JSON }}
        run: node cloud/publish-scheduled.js

      - name: Commit updated schedule (if changed)
        run: |
          if [ -n "$(git status --porcelain schedule/posts.json)" ]; then
            git config user.name "threads-auto-publisher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add schedule/posts.json
            git commit -m "chore: update schedule status [skip ci]"
            git push
          else
            echo "변경 사항 없음"
          fi
