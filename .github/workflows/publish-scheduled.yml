name: Publish scheduled Threads + Instagram posts

on:
  schedule:
    # 5분마다 실행 (Instagram 06:00 KST 슬롯과 재시도를 빠르게 처리)
    # 몇 분 정도 늦게 도는 경우가 있습니다 - 개인 자동화 용도로는 충분합니다)
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish due posts
        env:
          THREADS_ACCOUNTS_JSON: ${{ secrets.THREADS_ACCOUNTS_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNTS_JSON: ${{ secrets.INSTAGRAM_ACCOUNTS_JSON }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v24.0' }}
          # schedule/posts.json을 로컬 git 커밋이 아니라 GitHub Contents API로 직접 읽고 쓴다
          # (githubStore.js) - 로컬 앱의 다른 쓰기 작업과 동시에 일어나도 충돌 시 자동으로
          # 안전하게 재시도된다. 2026-08-29: 예전 방식(plain git commit && push, 별도 스텝)은
          # 이 API 기반 쓰기와 경합하다 push가 실패하면 "방금 게시했다"는 기록이 통째로
          # 유실돼서 같은 글이 중복 게시되는 사고가 있었음 - 그래서 이 스텝 하나로 합침.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node cloud/publish-scheduled.js

  publish-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check recruitment mutations
        run: node --test test/jobsCloudMutations.test.js test/jobsCloudPublisher.test.js
      - name: Publish due recruitment posts
        env:
          JOB_THREADS_ACCOUNTS_JSON: ${{ secrets.JOB_THREADS_ACCOUNTS_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node cloud/publish-jobs.js

  # 채용 블로그 첫 화면 게시판(board/jobs.json) 갱신을 정시에 깨운다(2026-11-10 추가).
  # jobs-board.yml의 GitHub 자체 schedule은 3~10시간씩 밀려서, 워커가 15분마다 깨우는 이 워크플로에서
  # KST 06:40·08:00·17:00 슬롯마다 한 번 jobs-board.yml을 workflow_dispatch로 실행한다(cloud/jobs-board-trigger.js).
  # 위 두 게시 작업과 서로 기다리지 않는 독립 작업이고, 실패해도 이 워크플로 결과를 실패로 만들지 않는다.
  jobs-board-trigger:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check trigger rules
        run: node --test test/jobsBoardTrigger.test.js
      - name: Wake jobs board in KST slots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node cloud/jobs-board-trigger.js
